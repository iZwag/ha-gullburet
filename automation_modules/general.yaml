# TIPS:
# Want to remove default, unused 'metadata: {-}' and 'data: {-}' fields?
# Search and replace (with nothing) with this Regex: ^.*data: \{\}.*\n?
  
- id: '1708602051833'
  alias: Special - Handle Vacation return time
  description: Disables vacation mode 6 hours before the set return time, starting
    thermostats and vacuum cleaning so that it is ready for return.
  trigger:
  - platform: template
    value_template: "{{ now().timestamp() >= (as_timestamp(states('input_datetime.vacation_return_time')) - (6 * 3600)) }}"
  condition: []
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.vacation_mode_enable
  mode: single

- id: '1708616104405'
  alias: Special - Handle Guest mode ON/OFF
  description: Reacts to changes in the state of input_boolean-helper Guest mode.
    If it gets turned on (enabled) or turned off (disabled).
  trigger:
  - platform: state
    entity_id:
    - input_boolean.guest_mode_enable
    from: 'off'
    to: 'on'
    id: enabled
  - platform: state
    entity_id:
    - input_boolean.guest_mode_enable
    from: 'on'
    to: 'off'
    id: disabled
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - enabled
      sequence:
      - service: input_select.select_option
        data:
          option: Sleep
        target:
          entity_id: input_select.heating_mode_guest
    - conditions:
      - condition: trigger
        id:
        - disabled
      sequence:
      - service: input_select.select_option
        data:
          option: Away
        target:
          entity_id: input_select.heating_mode_guest
  mode: single

- id: '1710864540464'
  alias: Power - Handle new hour consumption recorded
  description: Takes a newly updated hourly power consumption in kWh and compares
    to the current month top 3 max-hours. If it is among them, it is inserted at the
    correct level
  trigger:
  - platform: state
    entity_id:
    - input_number.energy_last_hour_consumed
  condition: []
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.power_grid_monthly_variable_price
    data:
      value: >
        {% set last_hour = states('input_number.energy_last_hour_consumed') | float %}
        {% set hour_price = states('sensor.elvia_variable_pricing_this_hour') | float %}
        {% set month_price = states('input_number.power_grid_monthly_variable_price') | float %}
        {{ ( (last_hour * hour_price) + month_price ) | round(2) }}
  - service: python_script.power_compare_maxhours
    data:
      newhour_value: "{{ states('input_number.energy_last_hour_consumed') }}"
      newhour_time: "{{ states('input_datetime.energy_last_hour_consumed') }}"
      top_maxhour_val_1: 'input_number.energy_monthly_maxhour_1'
      top_maxhour_time_1: 'input_datetime.energy_monthly_maxhour_1'
      top_maxhour_val_2: 'input_number.energy_monthly_maxhour_2'
      top_maxhour_time_2: 'input_datetime.energy_monthly_maxhour_2'
      top_maxhour_val_3: 'input_number.energy_monthly_maxhour_3'
      top_maxhour_time_3: 'input_datetime.energy_monthly_maxhour_3'
      top_maxhour_val_4: 'input_number.energy_monthly_maxhour_4'
      top_maxhour_time_4: 'input_datetime.energy_monthly_maxhour_4'
  mode: single

- id: '1710100627159'
  alias: Power - Store last hour consumption
  description: ''
  trigger:
  - platform: time_pattern
    minutes: '59'
    seconds: '56'
  condition: []
  action:
  - service: input_datetime.set_datetime
    data:
      entity_id: input_datetime.energy_last_hour_consumed
      datetime: "{{ now().strftime('%Y-%m-%d %H:00:00') }}"
  - service: input_number.set_value
    data:
      value: "{{states('sensor.energy_consumed_this_hour_tibber')}}"
    target:
      entity_id: input_number.energy_last_hour_consumed
  mode: single

