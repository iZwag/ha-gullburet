# TRASHLOG
title: Trashlog
path: trashlog
type: custom:grid-layout
theme: ios-dark-mode
background: center / cover no-repeat url("/local/ui/bg-gradient3.png") fixed
layout: 
  grid-template-columns: 24% 1fr
  grid-template-areas: '"sidebar main"'
  grid-template-rows: min-content
  padding: 0px
  margin: 0px
cards:
  # SIDEBAR CONTENTS
  - type: custom:decluttering-card
    template: tablet_sidebar
    variables:
      - active_link: "trashlog"

  # MAIN VIEW CONTENT
  - type: iframe
    url: !secret trashlog_url
    aspect_ratio: 100%
    card_mod:
      style: |
        ha-card {
          padding: 0px;
          border-radius: 0px;
          border: none;
        }