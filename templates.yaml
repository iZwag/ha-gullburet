# Power sensors
- sensor:
    # Chat-GPT aproximated model for power consumption, fitted using a
    # exponential model: P(x) = a * e^(b*x) + c, where x = brightness
    # Measurements: 1% = 1.1W, 50% = 4.7W, 75% = 9.8W, 85% = 12.9W, 90% = 14.8W, 95% = 17W, 100% = 20W
    - name: "Power lightstrip kitchen"
      unique_id: power_lightstrip_kitchen
      device_class: power
      unit_of_measurement: W
      icon: mdi:flash
      state: >
        {% if is_state('light.undershelf_strip_kitchen', 'on') %}
          {% set brightness_int = state_attr('light.undershelf_strip_kitchen', 'brightness') | int %}
          {% set brightness = ((brightness_int / 255) | float) * 100 %}
          {% set a = 1.13587816 %}
          {% set b = 0.02862676 %}
          {% set c = -0.04965023 %}
          {{ (a * (e ** (b * brightness)) + c) | round(1) }}
        {% else %}
          0
        {% endif %}

    # Measured to be 3.3W when on
    - name: "Power mushroom living"
      unique_id: power_mushroom_living
      device_class: power
      unit_of_measurement: W
      icon: mdi:flash
      state: >
        {% if is_state('switch.mushroom_lamp_living', 'on') %}
          4
        {% else %}
          0
        {% endif %}

    # Measured to be 9W when on - Both Donut and Globe
    - name: "Power globe living"
      unique_id: power_globe_living
      device_class: power
      unit_of_measurement: W
      icon: mdi:flash
      state: >
        {% if is_state('switch.globe_lamp_living', 'on') %}
          9
        {% else %}
          0
        {% endif %}

    # Measured to be 7.1W when on
    - name: "Power stringlights veranda"
      unique_id: power_stringlights_veranda
      device_class: power
      icon: mdi:flash
      unit_of_measurement: W
      state: >
        {% if is_state('switch.string_lights_veranda', 'on') %}
          8
        {% else %}
          0
        {% endif %}

