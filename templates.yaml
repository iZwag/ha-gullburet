# Elvia fixed price levels 1-5 and the ACTIVE price level
- sensor:
  - unique_id: elvia_fixed_price_level_1
    name: Elvia fixed price level 1
    device_class: monetary
    unit_of_measurement: NOK
    state: >
      {{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[0]['monthlyTotal'] }}
    attributes:
      value_min: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[0]['valueMin'] }}"
      value_max: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[0]['valueMax'] }}"
      value_unit: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[0]['valueUnitOfMeasure'] }}"
      id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[0]['id'] }}"
      next_id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[0]['nextIdUp'] }}"
      prev_id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[0]['nextIdDown'] }}"

  - unique_id: elvia_fixed_price_level_2
    name: Elvia fixed price level 2
    device_class: monetary
    unit_of_measurement: NOK
    state: >
      {{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[1]['monthlyTotal'] }}
    attributes:
      value_min: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[1]['valueMin'] }}"
      value_max: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[1]['valueMax'] }}"
      value_unit: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[1]['valueUnitOfMeasure'] }}"
      id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[1]['id'] }}"
      next_id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[1]['nextIdUp'] }}"
      prev_id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[1]['nextIdDown'] }}"

  - unique_id: elvia_fixed_price_level_3
    name: Elvia fixed price level 3
    device_class: monetary
    unit_of_measurement: NOK
    state: >
      {{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[2]['monthlyTotal'] }}
    attributes:
      value_min: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[2]['valueMin'] }}"
      value_max: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[2]['valueMax'] }}"
      value_unit: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[2]['valueUnitOfMeasure'] }}"
      id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[2]['id'] }}"
      next_id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[2]['nextIdUp'] }}"
      prev_id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[2]['nextIdDown'] }}"

  - unique_id: elvia_fixed_price_level_4
    name: Elvia fixed price level 4
    device_class: monetary
    unit_of_measurement: NOK
    state: >
      {{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[3]['monthlyTotal'] }}
    attributes:
      value_min: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[3]['valueMin'] }}"
      value_max: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[3]['valueMax'] }}"
      value_unit: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[3]['valueUnitOfMeasure'] }}"
      id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[3]['id'] }}"
      next_id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[3]['nextIdUp'] }}"
      prev_id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[3]['nextIdDown'] }}"

  - unique_id: elvia_fixed_price_level_5 
    name: Elvia fixed price level 5
    device_class: monetary
    unit_of_measurement: NOK
    state: >
      {{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[4]['monthlyTotal'] }}
    attributes:
      value_min: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[4]['valueMin'] }}"
      value_max: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[4]['valueMax'] }}"
      value_unit: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[4]['valueUnitOfMeasure'] }}"
      id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[4]['id'] }}"
      next_id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[4]['nextIdUp'] }}"
      prev_id: "{{ state_attr('sensor.elvia_fixed_prices_raw', 'priceLevels')[4]['nextIdDown'] }}"

  - unique_id: elvia_active_fixed_price_level
    name: Elvia active fixed price level 
    device_class: monetary
    unit_of_measurement: NOK
    state: >
      {% set current_average = states('sensor.energy_monthly_maxhour_average') | float(default=0) %}
      {% for i in range(1, 6) %}
        {% set sensor_id = 'sensor.elvia_fixed_price_level_' ~ i %}
        {% set value_min = state_attr(sensor_id, 'value_min') | float(default=0) %}
        {% set value_max = state_attr(sensor_id, 'value_max') | float(default=2) %}
          {% if value_min <= current_average < value_max %}
            {{ states(sensor_id) }}
            {% break %}
          {% endif %}
      {% endfor %}
    attributes:
      level_max: >
        {% set current_average = states('sensor.energy_monthly_maxhour_average') | float(default=0) %}
        {% for i in range(1, 6) %}
          {% set sensor_id = 'sensor.elvia_fixed_price_level_' ~ i %}
          {% set value_min = state_attr(sensor_id, 'value_min') | float(default=0) %}
          {% set value_max = state_attr(sensor_id, 'value_max') | float(default=2) %}
            {% if value_min <= current_average < value_max %}
              {{ state_attr(sensor_id, 'value_max') | float | round(1) }}
              {% break %}
            {% endif %}
        {% endfor %}
      prev_max: >
        {% set current_average = states('sensor.energy_monthly_maxhour_average') | float(default=0) %}
        {% for i in range(1, 6) %}
          {% set sensor_id = 'sensor.elvia_fixed_price_level_' ~ i %}
          {% set value_min = state_attr(sensor_id, 'value_min') | float(default=0) %}
          {% set value_max = state_attr(sensor_id, 'value_max') | float(default=2) %}
            {% if value_min <= current_average < value_max %}
              {{ state_attr(sensor_id, 'value_min') | float | round(1) }}
              {% break %}
            {% endif %}
        {% endfor %}

# Monthly power max-hours 1-4 sensor trackers and average
- sensor:
  - unique_id: energy_monthly_maxhour_1
    name: Energy monthly maxhour 1
    device_class: energy
    unit_of_measurement: kWh
    state: "{{ states('input_number.energy_monthly_maxhour_1') | round(2) }}"
    attributes:
      start_time: "{{ states('input_datetime.energy_monthly_maxhour_1') }}"
      prcnt_of_limit: >
        {% set maxhour = states('input_number.energy_monthly_maxhour_1') | float(default=0) %}
        {% set limit = state_attr('sensor.elvia_active_fixed_price_level', 'level_max') | float(default=2) %}
        {% if limit > 0 %}
          {{ ((maxhour / limit) * 100 ) | round(2) }}
        {% else %}
          {{ ((maxhour / 2) * 100 ) | round(2) }}
        {% endif %}

  - unique_id: energy_monthly_maxhour_2
    name: Energy monthly maxhour 2
    device_class: energy
    unit_of_measurement: kWh
    state: "{{ states('input_number.energy_monthly_maxhour_2') | round(2) }}"
    attributes:
      start_time: "{{ states('input_datetime.energy_monthly_maxhour_2') }}"
      prcnt_of_limit: >
        {% set maxhour = states('input_number.energy_monthly_maxhour_2') | float(default=0) %}
        {% set limit = state_attr('sensor.elvia_active_fixed_price_level', 'level_max') | float(default=2) %}
        {% if limit > 0 %}
          {{ ((maxhour / limit) * 100 ) | round(2) }}
        {% else %}
          {{ ((maxhour / 2) * 100 ) | round(2) }}
        {% endif %}

  - unique_id: energy_monthly_maxhour_3
    name: Energy monthly maxhour 3
    device_class: energy
    unit_of_measurement: kWh
    state: "{{ states('input_number.energy_monthly_maxhour_3') | round(2) }}"
    attributes:
      start_time: "{{ states('input_datetime.energy_monthly_maxhour_3') }}"
      prcnt_of_limit: >
        {% set maxhour = states('input_number.energy_monthly_maxhour_3') | float(default=0) %}
        {% set limit = state_attr('sensor.elvia_active_fixed_price_level', 'level_max') | float(default=2) %}
        {% if limit > 0 %}
          {{ ((maxhour / limit) * 100 ) | round(2) }}
        {% else %}
          {{ ((maxhour / 2) * 100 ) | round(2) }}
        {% endif %}
  
  - unique_id: energy_monthly_maxhour_4
    name: Energy monthly maxhour 4
    device_class: energy
    unit_of_measurement: kWh
    state: "{{ states('input_number.energy_monthly_maxhour_4') | round(2) }}"
    attributes:
      start_time: "{{ states('input_datetime.energy_monthly_maxhour_4') }}"
      prcnt_of_limit: >
        {% set maxhour = states('input_number.energy_monthly_maxhour_4') | float(default=0) %}
        {% set limit = state_attr('sensor.elvia_active_fixed_price_level', 'level_max') | float(default=2) %}
        {% if limit > 0 %}
          {{ ((maxhour / limit) * 100 ) | round(2) }}
        {% else %}
          {{ ((maxhour / 2) * 100 ) | round(2) }}
        {% endif %}
  
  # Holds the calculated average of this month's top 3 max-hour consumption
  # The attribute holds the percentage of the comparison of the average to the
  #  current fixed-price level
  - unique_id: energy_monthly_maxhour_average
    name: Energy monthly maxhour average
    device_class: energy
    unit_of_measurement: kWh
    state: >
      {% set maxhour1 = states('input_number.energy_monthly_maxhour_1') | float(default=0) %}
      {% set maxhour2 = states('input_number.energy_monthly_maxhour_2') | float(default=0) %}
      {% set maxhour3 = states('input_number.energy_monthly_maxhour_3') | float(default=0) %}
      {{ ((maxhour1 + maxhour2 + maxhour3) / 3) | round(2) }}
    attributes:
      prcnt_of_limit: >
        {% set maxhour = states('sensor.energy_monthly_maxhour_average') | float(default=0) %}
        {% set limit = state_attr('sensor.elvia_active_fixed_price_level', 'level_max') | float(default=2) %}
        {{ ((maxhour / limit) * 100 ) | round(2) }}

# Power price-chart show 24h or 48h state tracker
- sensor:
  - unique_id: power_price_chart_show_hours
    name: Power price chart show hours
    state: >
      {% if now().hour < 13 %}
        24h
      {% else %}
        48h
      {% endif %}

# WEATHER
# Entities to store _hourly_ and _daily_ weather forecast from Met-integration (Met.no)
#  * Used to be included in the weather-entity provided by Met, but as of 
#    March 2024 it is no longer provided.
# Also summarizes interesting weather now & today
# TODO: "Feels like" temperatures only consider "cold temperatures",
#       should accommodate for warm temperatures as well. Look it up.
# TODO: "Use the Norwegian translations for weather_conditions"
- trigger:
  - platform: time_pattern
    hours: /1
  - platform: homeassistant
    event: start
  action:
  - action: weather.get_forecasts
    data:
      type: hourly
    target:
      entity_id: weather.yr_weather_home
    response_variable: hourly_data
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: weather.yr_weather_home
    response_variable: daily_data
  sensor:
  - name: YR Weather forecast, hourly
    unique_id: yr_weather_forecast_hourly
    state: "{{ state_attr('weather.yr_weather_home', 'temperature') | float(default=0) }}"
    attributes:
      forecast: "{{ hourly_data['weather.yr_weather_home'].forecast }}"
  - name: YR Weather forecast, daily
    unique_id: yr_weather_forecast_daily
    state: "{{ state_attr('weather.yr_weather_home', 'temperature') | float(default=0) }}"
    attributes:
      forecast: "{{ daily_data['weather.yr_weather_home'].forecast }}"
  - name: YR Weather custom
    unique_id: yr_weather_custom
    state: "{{ now().isoformat() }}"
    attributes:
      this_hour_condition: >
        {% from 'weather_templates.jinja' import translate_condition_en %}
        {{ translate_condition_en(hourly_data['weather.yr_weather_home'].forecast[0].condition) }}
      this_hour_icon: >
        {% set weather = hourly_data['weather.yr_weather_home'].forecast[0].condition  %}
        {% if is_state('sun.sun', 'above_horizon') %}
        {{ '/local/ui/weather/' + weather + '.svg' }}
        {% else %}
        {{ '/local/ui/weather/' + weather + '_night.svg' }}
        {% endif %}
