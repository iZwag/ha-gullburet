    icon: mdi:water-percent
    state: "{{ 0 | float(default=0) }}"

# Misc appliance and device sensors
- sensor:
  - name: "Active media player"
    unique_id: active_media_player
    icon: mdi:speaker
    state: >
        {% if is_state('media_player.sonos_living', 'playing') and
          not is_state_attr('media_player.sonos_living', 'source', 'TV') %}
          living
        {% elif is_state('media_player.sonos_move', 'playing') %}
          move
        {% elif is_state('media_player.sonos_kitchen', 'playing') %}
          kitchen
        {% else %}
          none
        {% endif %}

  # Finds the current setting of the physical remote for the heated sheet
  - name: "Heated sheet setting"
    unique_id: heated_sheet_setting
    icon: mdi:thermometer
    state: >-
        {% if states('sensor.power_seasonal_heat')|float >= 0 and states('sensor.power_seasonal_heat')|float < 1 %}
          Off
        {% elif states('sensor.power_seasonal_heat')|float >= 15 and states('sensor.power_seasonal_heat')|float <= 20 %}
          #1
        {% elif states('sensor.power_seasonal_heat')|float >= 28 and states('sensor.power_seasonal_heat')|float <= 40 %}
          Feet
        {% elif states('sensor.power_seasonal_heat')|float >= 50 and states('sensor.power_seasonal_heat')|float <= 80 %}
          #2
        {% else %}
          On
        {% endif %}
    

  # Dedicated sensor for robot vacuum battery status
  #- name: "Vaskepott battery status"
  #- unique_id: vaskepott_battery
  #- unit_of_measurement: "%"
  #- state: "{{ state_attr('vacuum.vaskepott', 'battery_level') }}"
  #- device_class: battery


  # Translates the robot vacuum fan-speed from default Xiaomi to Roborock terminology
  - name: "Vaskepott current fan-speed"
    unique_id: vaskepott_fan_speed
    state: >-
      {% set fan_speed = state_attr('vacuum.vaskepott', 'fan_speed') %}
      {% if fan_speed == "Silent" %}
        Quiet
      {% elif fan_speed == "Standard" %}
        Balanced
      {% elif fan_speed == "Medium" %}
        Turbo
      {% elif fan_speed == "Turbo" %}
        Max
      {% elif fan_speed == "105" %}
        Off
      {% else %}
        Unknown
      {% endif %}
    
# Namron panel heater temperature calibration trackers
- sensor:
  - name: "Temperature difference office"
    unique_id: temperature_difference_office
    device_class: temperature
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    state: >
        {% set diff = (states('sensor.temperature_room_office') | float(default=0)) -
          (state_attr('climate.panel_heater_office', 'local_temperature') | float(default=0))
        %}
        {% if (diff > -0.5) and (diff < 0.5) %}
          {% set diff = 0 %}
        {% elif diff > 6 %}
          {% set diff = 6 %}
        {% elif diff < -6 %}
          {% set diff = -6 %}
        {% endif %}
        {% set cal = diff + 
          (state_attr('climate.panel_heater_office', 'local_temperature_calibration') | float(default=0)) %}
        {% if cal > 3 %}
          {{ 3 }}
        {% elif cal < -3 %}
          {{ -3 }}
        {% else %}
          {{ cal | round(1)}}
        {% endif %}
    
