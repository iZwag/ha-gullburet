    state: "{{ state_attr('weather.yr_weather_home', 'temperature') }}"
    
    
  # Humidity sensor for current outdoor humidity
  - name: "Humidity outdoor"
    unique_id: humidity_outdoor
    unit_of_measurement: "%"
    device_class: humidity
    icon: mdi:water-percent
    state: "{{ state_attr('weather.yr_weather_home', 'humidity') }}"
    
  # Always 0 humidity placeholder
  - name: "Humidity placeholder"
    unique_id: humidity_placeholder
