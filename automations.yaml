- id: '1736716190594'
  alias: Cleaning - Handle 2x deep clean
  description: ''
  trigger:
  - platform: state
    entity_id:
    - vacuum.vaskepott
    from: returning
    to: docked
    id: returned
  condition: []
  action:
  - service: input_boolean.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.show_vacuum_map
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - returned
      - condition: state
        entity_id: input_boolean.mop_after_vacuum
        state: 'on'
      - condition: state
        entity_id: binary_sensor.vaskepott_mop_ready
        state: 'on'
    then:
    - wait_for_trigger:
      - platform: state
        entity_id:
        - vacuum.vaskepott
        attribute: status
        to: Emptying the bin
        for:
          hours: 0
          minutes: 0
          seconds: 15
      timeout:
        hours: 0
        minutes: 0
        seconds: 30
        milliseconds: 0
    - service: input_boolean.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: input_boolean.mop_after_vacuum
    - service: input_text.set_value
      metadata: {}
      data:
        value: 2x deep clean vac & mop
      target:
        entity_id: input_text.last_cleaning_mode
    - service: script.robot_set_mop_mode
      metadata: {}
      data:
        mopping_mode: High
        mopping_route: DeepPlus
    - delay:
        hours: 0
        minutes: 0
        seconds: 2
        milliseconds: 0
    - if:
      - condition: template
        value_template: '{{ is_state(''input_text.selected_room_ids_cleaning'', "[]")
          }}'
      then:
      - service: vacuum.start
        metadata: {}
        data: {}
        target:
          entity_id: vacuum.vaskepott
      else: []
    - service: xiaomi_miio.vacuum_clean_segment
      data:
        segments: '{{ states(''input_text.selected_room_ids_cleaning'') }}'
      target:
        entity_id: vacuum.vaskepott
    else: []
  - service: input_boolean.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.mop_after_vacuum
  mode: single
