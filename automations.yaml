- id: '1710788675192'
  alias: Power - Reset grid price variables at new month
  description: Resets all the variables associated with keeping track of grid company
    bill, such as max-hours, max-hours dates, variable cost sum
  trigger:
  - platform: numeric_state
    entity_id:
    - sensor.cost_monthly_tibber
    below: 0.1
  condition: []
  action:
  - service: input_number.set_value
    data:
      value: 0
    target:
      entity_id:
      - input_number.energy_monthly_maxhour_1
      - input_number.energy_monthly_maxhour_2
      - input_number.energy_monthly_maxhour_3
      - input_number.power_grid_monthly_variable_price
      - input_number.energy_monthly_maxhour_4
  - service: input_datetime.set_datetime
    target:
      entity_id:
      - input_datetime.energy_monthly_maxhour_1
      - input_datetime.energy_monthly_maxhour_2
      - input_datetime.energy_monthly_maxhour_3
      - input_datetime.energy_monthly_maxhour_4
    data:
      timestamp: '{{ now().replace(hour=0, minute=0, second=0, microsecond=0).timestamp()
        }}'
  mode: single
- id: '1711099990422'
  alias: Bedroom - Handle heated Sheet remote control on/off/up/down
  description: Controls the behavior of the heated sheet on/off/longer/shorter.
  trigger:
  - platform: state
    entity_id:
    - sensor.sheet_remote_action
    to: on-press
    id: 'on'
  - platform: state
    entity_id:
    - sensor.sheet_remote_action
    to: off-press
    id: 'off'
  - platform: state
    entity_id:
    - sensor.sheet_remote_action
    to: up-press
    id: up
  - platform: state
    entity_id:
    - sensor.sheet_remote_action
    to: down-press
    id: down
  condition: []
  action:
  - if:
    - condition: trigger
      id:
      - 'on'
    then:
    - service: script.bedroom_heated_sheet_control
      data:
        command: 'on'
        increase: 00:30:00
  - if:
    - condition: trigger
      id:
      - 'off'
    then:
    - service: script.bedroom_heated_sheet_control
      data:
        command: 'off'
  - if:
    - condition: trigger
      id:
      - up
    then:
    - service: script.bedroom_heated_sheet_control
      data:
        command: up
        increase: 00:30:00
  - if:
    - condition: trigger
      id:
      - down
    then:
    - service: script.bedroom_heated_sheet_control
      data:
        command: down
        decrease: 00:10:00
  mode: queued
- id: '1711100194488'
  alias: Bedroom - Handle heated sheet timer start/finish
  description: ''
  trigger:
  - platform: state
    entity_id:
    - timer.heated_sheet_timer
    from: idle
    to: active
    id: starts
  - platform: state
    entity_id:
    - timer.heated_sheet_timer
    to: idle
    from: active
    id: finishes
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - starts
      sequence:
      - service: switch.turn_on
        data: {}
        target:
          entity_id: switch.plug_seasonal_heat
      alias: STARTS
    - conditions:
      - condition: trigger
        id:
        - finishes
      sequence:
      - service: switch.turn_off
        data: {}
        target:
          entity_id: switch.plug_seasonal_heat
      alias: FINISHES
  mode: single
- id: '1712088086740'
  alias: System - Daily reset & maintenance tasks
  description: Performs resets, upgrades and maintenance at a daily time set by the
    provided time-helper.
  triggers:
  - at: input_datetime.system_daily_reset_time
    trigger: time
  conditions: []
  actions:
  - data: {}
    action: script.lights_reset_overrides
  - target:
      entity_id:
      - input_boolean.party_mode_enable
      - input_boolean.lights_movie_mode
      - input_boolean.lights_dining_mode
      - input_boolean.lights_cooking_mode
      - input_boolean.guest_show_wifi
      - input_boolean.select_rooms_cleaning
    data: {}
    action: input_boolean.turn_off
  - data: {}
    action: script.deselect_floorplan_room
  - target:
      entity_id: input_select.bathroom_mode_select
    data:
      option: 'off'
    action: input_select.select_option
  - metadata: {}
    data: {}
    action: script.speakers_unjoin_all
  - metadata: {}
    data:
      option: Living room
    target:
      entity_id: input_select.audio_speaker_select
    action: input_select.select_option
  mode: single
- id: '1712303592468'
  alias: Bathroom - Handle light mode change
  description: ''
  trigger:
  - platform: state
    entity_id:
    - input_select.bathroom_mode_select
  condition: []
  action:
  - service: script.bathroom_control_light_mode
    data:
      setting: '{{ states(''input_select.bathroom_mode_select'') }}'
  mode: single
- id: '1713360573726'
  alias: Wakeup - Time triggered actions
  description: Handles all time-triggered actions associated with the wakeup rotuine
    (lights, audio, blinds etc.). Enable-toggle must be ON.
  triggers:
  - at: input_datetime.wakeup_light_start
    id: light-start
    trigger: time
  - at: input_datetime.wakeup_alarm_time
    id: alarm
    trigger: time
  - at: input_datetime.wakeup_blinds_open
    id: blinds-open
    trigger: time
  - at: input_datetime.wakeup_audio_amp
    id: amplify-audio
    trigger: time
  - at: input_datetime.wakeup_audio_loud
    id: audio-loud
    trigger: time
  - at: input_datetime.wakeup_ends
    id: routine-ends
    trigger: time
  conditions:
  - condition: state
    entity_id: input_boolean.wakeup_alarm_active
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - light-start
      sequence:
      - data:
          brightness_pct: 40
          transition: 300
        target:
          entity_id: light.bedroom_pendant
        action: light.turn_on
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 6500
          brightness_pct: 25
          transition: 300
        target:
          entity_id: light.shelf_strip_bedroom
    - conditions:
      - condition: trigger
        id:
        - alarm
      sequence:
      - data:
          brightness_pct: 100
          transition: 300
        target:
          entity_id: light.bedroom_pendant
        action: light.turn_on
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 6500
          brightness_pct: 75
          transition: 60
        target:
          entity_id: light.shelf_strip_bedroom
      - action: light.turn_on
        metadata: {}
        data:
          transition: 180
          color_temp_kelvin: 6500
          brightness_pct: 60
        target:
          entity_id: light.reading_lamp_bedroom
    - conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - blinds-open
        - condition: state
          entity_id: light.bedroom_pendant
          state: 'on'
      sequence:
      - metadata: {}
        data: {}
        target:
          entity_id:
          - cover.left_blind_bedroom
          - cover.right_blind_bedroom
        action: cover.open_cover
    - conditions:
      - condition: trigger
        id:
        - amplify-audio
      sequence:
      - if:
        - condition: state
          entity_id: media_player.sonos_bedroom
          state:
          - playing
        then:
        - target:
            entity_id: media_player.sonos_bedroom
          data:
            volume_level: '{{ (states(''input_number.wakeup_audio_start_volume'')
              | float) + 0.05 }}'
          action: media_player.volume_set
    - conditions:
      - condition: trigger
        id:
        - audio-loud
      sequence:
      - if:
        - condition: state
          entity_id: media_player.sonos_bedroom
          state: playing
        then:
        - data:
            volume_level: '{{ (states(''input_number.wakeup_audio_start_volume'')
              | float) + 0.1 }}'
          target:
            entity_id: media_player.sonos_bedroom
          action: media_player.volume_set
    - conditions:
      - condition: trigger
        id:
        - routine-ends
      sequence:
      - metadata: {}
        data: {}
        target:
          entity_id: cover.curtain_living
        action: cover.close_cover
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ now().weekday() == 4 }}'
          sequence:
          - metadata: {}
            data:
              option: weekend
            target:
              entity_id: input_select.wakeup_display_time
            action: input_select.select_option
          alias: Test if its friday
        - conditions:
          - condition: template
            value_template: '{{ now().weekday() == 6 }}'
          sequence:
          - metadata: {}
            data:
              option: weekday
            target:
              entity_id: input_select.wakeup_display_time
            action: input_select.select_option
          alias: Test if its sunday
      - if:
        - condition: state
          entity_id: input_select.climate_season_select
          state: Warm
        then:
        - metadata: {}
          data: {}
          target:
            entity_id:
            - cover.left_blind_bedroom
            - cover.right_blind_bedroom
          action: cover.close_cover
      - action: light.turn_off
        metadata: {}
        target:
          entity_id:
          - light.shelf_strip_bedroom
          - light.reading_lamp_bedroom
        data: {}
  mode: queued
  max: 10
- id: '1714376090355'
  alias: Bedroom - Pause Sonos when light turned off
  description: ''
  triggers:
  - entity_id:
