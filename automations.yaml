- id: '1717858387784'
  alias: Veranda - Handle remote presses L/R/MID/UP/DOWN
  description: ''
  triggers:
  - entity_id:
    - sensor.action_curtain_control_kitchen
    to:
    - arrow_right_click
    id: right
    trigger: state
  - entity_id:
    - sensor.action_curtain_control_kitchen
    to:
    - arrow_left_click
    id: left
    trigger: state
  - entity_id:
    - sensor.action_curtain_control_kitchen
    to:
    - 'on'
    id: up
    trigger: state
  - entity_id:
    - sensor.action_curtain_control_kitchen
    to:
    - 'off'
    id: down
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - left
      sequence:
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: sensor.curtain_state_living
            state: stopped
        then:
        - metadata: {}
          data: {}
          target:
            entity_id: cover.curtain_living
          action: cover.stop_cover
        else:
        - target:
            entity_id: cover.curtain_living
          data: {}
          action: cover.close_cover
    - conditions:
      - condition: trigger
        id:
        - right
      sequence:
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: sensor.curtain_state_living
            state: stopped
        then:
        - metadata: {}
          data: {}
          target:
            entity_id: cover.curtain_living
          action: cover.stop_cover
        else:
        - metadata: {}
          data: {}
          target:
            entity_id: cover.curtain_living
          action: cover.open_cover
    - conditions:
      - condition: trigger
        id:
        - up
      sequence:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.string_lights_veranda
        data: {}
    - conditions:
      - condition: trigger
        id:
        - down
      sequence:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.string_lights_veranda
        data: {}
  mode: single
