- id: '1749332974341'
  alias: Bedtime - Handle input changes
  description: Reacts to changes done to UI-inputs related to Bedtime. Must not validate
    enable-toggle.
  trigger:
  - platform: state
    entity_id:
    - input_number.bedtime_reminder_after_delay
    id: reminder-delay
  - platform: state
    entity_id:
    - input_number.bedtime_reminder_before_advance
    id: reminder-advance
  - platform: state
    entity_id:
    - input_number.bedtime_sheet_preheat_advance
    id: preheat-advance
  - platform: state
    entity_id:
    - input_boolean.bedtime_heating_sheet_enable
    id: sheet-on
    from: 'off'
    to: 'on'
  - platform: state
    entity_id:
    - input_boolean.bedtime_heating_sheet_enable
    id: sheet-off
    from: 'on'
    to: 'off'
  - platform: state
    entity_id:
    - input_datetime.bedtime_trigger_weekdays
    id: trigger-weekdays
  - platform: state
    entity_id:
    - input_datetime.bedtime_trigger_weekends
    id: trigger-weekends
  - platform: state
    entity_id:
    - input_boolean.bedtime_trigger_active
    from: 'off'
    to: 'on'
    id: trigger-enabled
  - platform: state
    entity_id:
    - input_boolean.bedtime_trigger_active
    from: 'on'
    to: 'off'
    id: trigger-disabled
  - platform: time
    at: 08:00:00
    id: display-check
  - platform: state
    entity_id:
    - input_select.bedtime_display_time
    to: weekend
    from: weekday
    id: to-weekend
  - platform: state
    entity_id:
    - input_select.bedtime_display_time
    id: to-weekday
    from: weekend
    to: weekday
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - preheat-advance
      sequence:
      - service: script.adjust_datetime
        data:
          base_datetime: '{{ states(''input_datetime.bedtime_trigger_time'') }}'
          delta_minutes: '{{ states(''input_number.bedtime_sheet_preheat_advance'')
            | int }}'
          target_entity: input_datetime.bedtime_sheet_preheating
    - conditions:
      - condition: trigger
        id:
        - reminder-advance
      sequence:
      - service: script.adjust_datetime
        data:
          base_datetime: '{{ states(''input_datetime.bedtime_trigger_time'') }}'
          delta_minutes: '{{ states(''input_number.bedtime_reminder_before_advance'')
            | int }}'
          target_entity: input_datetime.bedtime_reminder_before
    - conditions:
      - condition: trigger
        id:
        - reminder-delay
      sequence:
      - service: script.adjust_datetime
        data:
          base_datetime: '{{ states(''input_datetime.bedtime_trigger_time'') }}'
          delta_minutes: '{{ states(''input_number.bedtime_reminder_after_delay'')
            | int }}'
          target_entity: input_datetime.bedtime_reminder_after
    - conditions:
      - condition: trigger
        id:
        - trigger-enabled
      sequence: []
    - conditions:
      - condition: trigger
        id:
        - trigger-disabled
      sequence: []
    - conditions:
      - condition: trigger
        id:
        - to-weekday
        - trigger-weekdays
      sequence:
      - service: script.utility_set_alarm_time
        data:
          time_input: '{{ states(''input_datetime.bedtime_trigger_weekdays'') }}'
          alarm_entity: input_datetime.bedtime_trigger_time
    - conditions:
      - condition: trigger
        id:
        - alarm-weekends
        - to-weekend
      sequence:
      - service: script.utility_set_alarm_time
        data:
          time_input: '{{ states(''input_datetime.bedtime_trigger_weekends'') }}'
          alarm_entity: input_datetime.bedtime_trigger_time
    - conditions:
      - condition: trigger
        id:
        - display-check
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ now().weekday() == 4 }}'
          sequence:
          - service: input_select.select_option
            metadata: {}
            data:
              option: weekend
            target:
              entity_id:
              - input_select.bedtime_display_time
          alias: Test if its friday
        - conditions:
          - condition: template
            value_template: '{{ now().weekday() == 6 }}'
          sequence:
          - service: input_select.select_option
            metadata: {}
            data:
              option: weekday
            target:
              entity_id:
              - input_select.bedtime_display_time
          alias: Test if its sunday
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - if:
        - condition: state
          entity_id: input_select.bedtime_display_time
          state: weekday
        then:
        - service: script.utility_set_alarm_time
          data:
            time_input: '{{ states(''input_datetime.bedtime_trigger_weekdays'') }}'
            alarm_entity: input_datetime.bedtime_trigger_time
        else:
        - service: script.utility_set_alarm_time
          data:
            time_input: '{{ states(''input_datetime.bedtime_trigger_weekends'') }}'
            alarm_entity: input_datetime.bedtime_trigger_time
  mode: queued
  max: 10
