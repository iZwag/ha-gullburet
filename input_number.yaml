# WAKE-UP ROUTINE =============================================================
# Minutes of wakeup light
wakeup_light_start_advance:
  name: Wakeup - Light start advance
  icon: mdi:sun-angle
  min: -30
  max: -1
  step: 1
  mode: box
  unit_of_measurement: "minutes"

# Wakeup routine - audio start volume, at wakeup alarm
wakeup_audio_start_volume:
  name: Wakeup - Audio start volume
  icon: mdi:volume-low
  min: 0.08
  max: 0.25
  step: 0.01
  mode: box

# Wakeup routine - time before blinds go up, after wakeup alarm
wakeup_blinds_open_delay:
  name: Wakeup - Blinds open delay
  icon: mdi:roller-shade
  min: 0
  max: 30
  step: 1
  mode: box
  unit_of_measurement: "minutes"

# Wakeup routine - time before audio amplifies, after wakeup alarm
wakeup_audio_amp_delay:
  name: Wakeup - Audio amplifies delay
  icon: mdi:volume-medium
  min: 1
  max: 30
  step: 1
  mode: box
  unit_of_measurement: "minutes"

# Wakeup routine - time before audio amplifies, after wakeup alarm
wakeup_audio_loud_delay:
  name: Wakeup - Audio get loud delay
  icon: mdi:volume-high
  min: 15
  max: 45
  step: 1
  mode: box
  unit_of_measurement: "minutes"

# Wakeup routine - Sonos alarm ID constant
wakeup_sonos_alarm_id:
  name: Wakeup - Sonos alarm ID
  icon: mdi:speaker
  min: 1
  max: 10000
  step: 1
  mode: box

